<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>뉴스스탠드</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">NEWSSTAND</p>
          <h1>뉴스스탠드</h1>
        </div>
        <div class="summary">
          <span id="subscribed-count">0</span>
          <small>구독 중</small>
        </div>
      </header>

      <nav class="view-tabs" aria-label="뉴스스탠드 보기 방식">
        <button class="tab-button active" type="button" data-view="grid">전체 언론사</button>
        <button class="tab-button" type="button" data-view="subscribed">내가 구독한 언론사</button>
        <button class="tab-button" type="button" data-view="list">리스트 보기</button>
      </nav>

      <section class="portal-layout" aria-live="polite">
        <section class="press-panel" aria-label="언론사 목록">
          <div class="panel-head">
            <strong id="grid-title">전체 언론사</strong>
            <span id="page-label">1 / 3</span>
          </div>
          <div class="press-grid" id="press-grid"></div>
          <div class="pager" aria-label="페이지 이동">
            <button class="icon-button" type="button" id="prev-page" aria-label="이전 페이지">‹</button>
            <div class="dots" id="page-dots"></div>
            <button class="icon-button" type="button" id="next-page" aria-label="다음 페이지">›</button>
          </div>
        </section>

        <aside class="article-panel" aria-label="선택한 언론사 기사">
          <div class="selected-press">
            <span class="press-flag" id="selected-flag"></span>
            <div>
              <p id="selected-category"></p>
              <h2 id="selected-name"></h2>
            </div>
            <button class="subscribe-button" type="button" id="toggle-subscribe"></button>
          </div>

          <div class="progress-tabs" id="progress-tabs"></div>
          <ol class="article-list" id="article-list"></ol>
        </aside>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
