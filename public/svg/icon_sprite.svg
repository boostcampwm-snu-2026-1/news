    <polygon points="1.5,0 8,3.2 1.5,6.4" fill="#E8252A" />
  </symbol>

  <symbol id="plus" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
    <line x1="5" y1="1" x2="5" y2="9" />
    <line x1="1" y1="5" x2="9" y2="5" />
  </symbol>

  <symbol id="minus" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
    <line x1="1" y1="5" x2="9" y2="5" />
