<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="newsstand" viewBox="0 0 24 24" fill="none" stroke="#14212B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="20" height="18" />
    <line x1="2" y1="8" x2="22" y2="8" />
    <line x1="2" y1="13" x2="22" y2="13" />
    <line x1="7" y1="8" x2="7" y2="21" />
  </symbol>

  <symbol id="grid" viewBox="0 0 24 24" fill="none">
    <rect x="3" y="3" width="8" height="8" stroke="currentColor" stroke-width="1.3" />
    <rect x="13" y="3" width="8" height="8" stroke="currentColor" stroke-width="1.3" />
    <rect x="3" y="13" width="8" height="8" stroke="currentColor" stroke-width="1.3" />
    <rect x="13" y="13" width="8" height="8" stroke="currentColor" stroke-width="1.3" />
  </symbol>
 
  <symbol id="list" viewBox="0 0 24 24" fill="none" stroke-linecap="round">
    <line x1="3" y1="7" x2="21" y2="7" stroke="currentColor" stroke-width="1.3" />
    <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1.3" />
    <line x1="3" y1="17" x2="21" y2="17" stroke="currentColor" stroke-width="1.3" />
  </symbol>

  <symbol id="chevron-right" viewBox="0 0 8 13" fill="none">
    <path d="M1 1L7 6.5L1 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </symbol>

  <symbol id="flag" viewBox="0 0 8 10">
